MACHINE = "beaglebone-yocto"
DISTRO = "nodistro"
INHERIT += "rm_work"
USER_CLASSES ?= "buildstats"

INHERIT += "mender-full"

# Generate the raw disk image (.sdimg or .wic) and the OTA update artifact (.mender)
IMAGE_FSTYPES = "ext4 sdimg mender"

MENDER_ARTIFACT_NAME = "release-1.3"

# 2. Disable GRUB and UEFI layout injection
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"

# Set the Mender Server URL
MENDER_SERVER_URL = "https://mender.io"
# Set your specific Organization Tenant Token
# for security reasons, we configure this parameter on the target device at boot.
#MENDER_TENANT_TOKEN = "YOUR_ORGANIZATION_TENANT_TOKEN_HERE"

# set root password:
INHERIT += "extrausers"
EXTRA_USERS_PARAMS = " \
    usermod -p '\$6\$9TX/Rp3nDG9AdlTk\$SjPUKnX2WOqn5jMHJ0LwrjQGEO24GStfUkwZ0hmyStHf2CgZeDh7cMipdE2yMZCywai5njhzCCUxgCg7VwLSi.' root; \
    usermod -s /bin/bash root; \
"

DL_DIR = "${TOPDIR}/../downloads"

# install some additional packages into the image:
IMAGE_INSTALL:append = " \
        mmc-utils \
        bash \
        vim \
        usbutils \
        util-linux-lsblk \
        util-linux-sfdisk \
        networkmanager-nmcli \
        networkmanager-wifi \
        wpa-supplicant \
        iw ncurses-terminfo-base \
        rtl88x2bu \
        persistent-data \
"

EXTRA_IMAGE_FEATURES:append = " ssh-server-openssh"
IMAGE_FEATURES += "allow-root-login"

# 1. Install bash into the final image
IMAGE_INSTALL:append = " bash"
